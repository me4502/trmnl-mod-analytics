- keyname: about
  field_type: author_bio
  name: About Mod Analytics
  description: Shows total and per project downloads, as well as revenue, from mod platforms. Modrinth is supported right now. Project totals are public, but revenue requires a Modrinth Personal Access Token with PAYOUTS_READ.
  category: analytics

- keyname: provider
  field_type: select
  name: Platform
  description: Select the mod platform to show analytics for.
  options:
    - Modrinth: modrinth
  default: modrinth

- keyname: project_ids
  field_type: text
  name: Project slugs or IDs
  placeholder: worldedit, worldguard, craftbook
  description: Comma-separated or JSON array of project slugs/IDs for the selected platform.
  required: true

- keyname: api_key
  field_type: password
  name: API key or access token
  description: Optional for project totals, required for revenue. For Modrinth, create a PAT with the PAYOUTS_READ scope, then paste the raw token value.
  optional: true

- keyname: instance_title
  field_type: string
  name: Display title
  default: Mod Analytics
  optional: true
